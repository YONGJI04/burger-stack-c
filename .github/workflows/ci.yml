name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build and test the console game
        run: make test
      - name: Check memory and undefined behavior
        run: make sanitize
      - name: Test 100,000 seeded games
        run: ./build/test_game 20261104 100000
      - name: Install the Windows cross compiler
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64
      - name: Build the Windows executable
        run: make windows
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: burger-windows
          path: |
            build/burger.exe
            play.bat
            README.md
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: burger-linux
          path: burger
          retention-days: 14
